# rotaperfume_pipeline — ganha tarefas por sessão de curso:
#   1. raw_conferencia                                   (raw chegou ao Volume bronze.raw)
#   2. bronze_ingestao                                   (raw -> tabelas bronze)
#   3. silver_clientes, silver_pedidos,
#      silver_itens_e_produtos, silver_crm_e_financeiro  (bronze -> silver: tipos, chaves,
#                                                          duplicidade e contrato — 4 sql_task
#                                                          em paralelo, todas depends_on
#                                                          bronze_ingestao)
#   4. gold_dimensoes      (silver -> gold: dim_cliente, dim_produto, dim_vendedor,
#                           dim_calendario; depends_on as 4 tarefas silver)
#   5. gold_fato_vendas    (silver -> gold: fato_vendas, grão item de pedido;
#                           depends_on gold_dimensoes)
#   6. gold_marts          (gold: 3 marts sobre o mesmo fato; depends_on gold_fato_vendas)
#   7. testes                 (9 testes de qualidade, param o job se falhar;
#                              depends_on gold_marts, em paralelo com o item 8)
#   8. metricas_de_negocio    (gold: 6 views com nome de negócio; depends_on gold_marts)
#      auditoria_de_metadado  (quebra se faltar COMMENT na gold; depends_on metricas_de_negocio)
#   9. ml_features            (gold: features_treino + features_cliente; depends_on
#                              testes E auditoria_de_metadado — as duas checagens
#                              de qualidade da gold)
#  10. ml_modelo               (treina, registra em @prod e pontua gold.score_propensao,
#                              gold.modelo_metricas, gold.calibragem_holdout;
#                              depends_on ml_features)
#  11. ml_fila                 (gold.fila_semanal + as 4 funções do agente;
#                              depends_on ml_modelo)
#  12. gold_retorno_ligacao     (gold.retorno_ligacao — a única tabela cujo dado
#                              não vem do pipeline; CREATE TABLE IF NOT EXISTS;
#                              depends_on gold_marts, em paralelo com o resto)
resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql
        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql
        - task_key: silver_itens_e_produtos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-itens-e-produtos.sql
        - task_key: silver_crm_e_financeiro
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_e_produtos
            - task_key: silver_crm_e_financeiro
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/05-dimensoes.sql
        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-fato-vendas.sql
        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-marts.sql
        - task_key: testes
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-testes.sql
        - task_key: gold_retorno_ligacao
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/11-retorno-ligacao.sql
        - task_key: metricas_de_negocio
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/09-metricas-negocio.sql
        - task_key: auditoria_de_metadado
          depends_on:
            - task_key: metricas_de_negocio
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/10-auditoria-metadado.sql
        - task_key: ml_features
          depends_on:
            - task_key: testes
            - task_key: auditoria_de_metadado
          notebook_task:
            notebook_path: ../src/ml/11-features.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ml_modelo
          depends_on:
            - task_key: ml_features
          notebook_task:
            notebook_path: ../src/ml/12-modelo.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ml_fila
          depends_on:
            - task_key: ml_modelo
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ml/13-fila.sql
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
